<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice iPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="calculatrice.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="iphone">
            <div class="notch">
                <div class="speaker"></div>
                <div class="camera"></div>
            </div>
            <div class="status-bar">
                <div class="time">9:41</div>
                <div class="status-icons">
                    <span class="signal">📶</span>
                    <span class="wifi">📡</span>
                    <span class="battery">🔋</span>
                </div>
            </div>
            <div class="calculator">
                <div class="display">
                <div class="previous-operand"></div>
                <div class="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="operator" data-action="clear">AC</button>
                <button class="operator" data-action="plus-minus">±</button>
                <button class="operator" data-action="percentage">%</button>
                <button class="operator" data-operation>÷</button>
                
                <button data-number>7</button>
                <button data-number>8</button>
                <button data-number>9</button>
                <button class="operator" data-operation>×</button>
                
                <button data-number>4</button>
                <button data-number>5</button>
                <button data-number>6</button>
                <button class="operator" data-operation>-</button>
                
                <button data-number>1</button>
                <button data-number>2</button>
                <button data-number>3</button>
                <button class="operator" data-operation>+</button>
                
                <button class="span-two" data-number>0</button>
                <button data-number>.</button>
                <button class="operator" data-equals>=</button>
            </div>
        </div>
            </div>
            <div class="home-indicator"></div>
        </div>
    </div>
    <script src="calculatrice.js"></script>
</body>
</html>
